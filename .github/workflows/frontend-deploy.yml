name: Frontend Build & Deploy (ACA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        check-latest: true

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build frontend
      run: |
        pnpm --filter shared build
        pnpm --filter inchanted-frontend build

    - name: Validate deploy settings
      id: deploy_prereq
      shell: bash
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        AZURE_CLIENT_ID_LEGACY: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
        AZURE_TENANT_ID_LEGACY: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
        AZURE_SUBSCRIPTION_ID_LEGACY: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}
        AZURE_RG: ${{ secrets.AZURE_RG }}
        AZURE_FRONTEND_APP: ${{ secrets.AZURE_FRONTEND_APP }}
        AZURE_FRONTEND_IMAGE: ${{ secrets.AZURE_FRONTEND_IMAGE }}
      run: |
        set -euo pipefail
        missing=0
        auth_mode=""
        if [[ -n "${AZURE_CREDENTIALS}" ]]; then
          auth_mode="creds"
        elif [[ -n "${AZURE_CLIENT_ID_LEGACY}" && -n "${AZURE_TENANT_ID_LEGACY}" && -n "${AZURE_SUBSCRIPTION_ID_LEGACY}" ]]; then
          auth_mode="sp"
        else
          echo "Missing Azure login secrets: provide AZURE_CREDENTIALS or the legacy AZUREAPPSERVICE_* trio"
          missing=1
        fi
        if [[ -z "${AZURE_RG}" ]]; then echo "Missing required secret: AZURE_RG"; missing=1; fi
        if [[ -z "${AZURE_FRONTEND_APP}" ]]; then echo "Missing required secret: AZURE_FRONTEND_APP"; missing=1; fi
        if [[ -z "${AZURE_FRONTEND_IMAGE}" ]]; then echo "Missing required secret: AZURE_FRONTEND_IMAGE"; missing=1; fi
        if [[ "${missing}" -eq 1 ]]; then
          echo "should_skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "auth_mode=${auth_mode}" >> "$GITHUB_OUTPUT"
        echo "should_skip=false" >> "$GITHUB_OUTPUT"

    - name: Skip deploy when required secrets are missing
      if: ${{ steps.deploy_prereq.outputs.should_skip == 'true' }}
      run: |
        echo "Skipping frontend ACA deploy because required secrets are not configured in the staging environment."

    - name: Login to Azure
      if: ${{ steps.deploy_prereq.outputs.should_skip != 'true' && steps.deploy_prereq.outputs.auth_mode == 'creds' }}
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure (legacy service principal)
      if: ${{ steps.deploy_prereq.outputs.should_skip != 'true' && steps.deploy_prereq.outputs.auth_mode == 'sp' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}

    - name: Deploy to ACA
      if: ${{ steps.deploy_prereq.outputs.should_skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        az extension add --name containerapp --upgrade --yes
        az containerapp update \
          --resource-group "${{ secrets.AZURE_RG }}" \
          --name "${{ secrets.AZURE_FRONTEND_APP }}" \
          --image "${{ secrets.AZURE_FRONTEND_IMAGE }}" \
          --output none
