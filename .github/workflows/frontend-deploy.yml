name: Frontend Build & Deploy (ACA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        check-latest: true

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build frontend
      run: |
        pnpm --filter shared build
        pnpm --filter inchanted-frontend build

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to ACA
      uses: azure/container-apps-deploy-action@v1
      with:
        resourceGroup: ${{ secrets.AZURE_RG }}
        containerAppName: ${{ secrets.AZURE_FRONTEND_APP }}
        imageToDeploy: ${{ secrets.AZURE_FRONTEND_IMAGE }}
        registryUrl: ${{ secrets.AZURE_REGISTRY_URL }}
        registryUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        registryPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
