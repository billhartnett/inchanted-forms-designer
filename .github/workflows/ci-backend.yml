name: CI Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Monorepo build chain (shared -> wave8 -> wave9 -> inchanted-api)
        run: |
          pnpm --filter shared build
          pnpm --filter wave8 build
          pnpm --filter wave9 build
          pnpm --filter inchanted-api build

      - name: TypeScript compile checks
        run: |
          node node_modules/.bin/tsc -p shared/tsconfig.json --noEmit
          node node_modules/.bin/tsc -p backend/api/tsconfig.json --noEmit

      - name: Start Express backend and run endpoint smoke tests
        continue-on-error: true
        run: |
          node backend/api/dist/server.js > backend-api.log 2>&1 &
          APP_PID=$!
          trap "echo '=== Server log on exit ==='; cat backend-api.log; echo '================='" EXIT

          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:8080/api/ping >/dev/null 2>&1; then
              echo "Server is up after $i seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::warning::Server did not start within 30 seconds - check server log above"
              cat backend-api.log
              exit 0
            fi
            sleep 1
          done

          PING_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/ping || echo "000")
          echo "::notice::/api/ping status: $PING_STATUS"

          HEALTH_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-actor-role: viewer" -H "x-tenant-id: ci-tenant" http://127.0.0.1:8080/api/gethealth || echo "000")
          HEALTH_BODY=$(curl -sS -H "x-actor-role: viewer" -H "x-tenant-id: ci-tenant" http://127.0.0.1:8080/api/gethealth || echo "connection_failed")
          echo "::notice::/api/gethealth status: $HEALTH_STATUS body: $HEALTH_BODY"

          VER_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/version || echo "000")
          echo "::notice::/api/version status: $VER_STATUS"

          echo "Smoke test results: ping=$PING_STATUS health=$HEALTH_STATUS version=$VER_STATUS"
