name: CI Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Monorepo build chain (shared -> wave8 -> wave9 -> inchanted-api)
        run: |
          pnpm --filter shared build
          pnpm --filter wave8 build
          pnpm --filter wave9 build
          pnpm --filter inchanted-api build

      - name: TypeScript compile checks
        run: |
          pnpm --filter shared exec tsc -p tsconfig.json --noEmit
          pnpm --filter inchanted-api exec tsc -p tsconfig.json --noEmit

      - name: Start Express backend and run endpoint smoke tests
        continue-on-error: true
        run: |
          node backend/api/dist/server.js > backend-api.log 2>&1 &
          APP_PID=$!
          sleep 5
          cat backend-api.log || true
          curl -sS http://127.0.0.1:8080/api/ping || true
          echo "Smoke test step complete"
          kill $APP_PID 2>/dev/null || true
