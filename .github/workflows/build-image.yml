name: Build Image

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required image build secrets
        id: prereq
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_REGISTRY_URL: ${{ secrets.AZURE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          MISSING=0
          if [[ -z "${AZURE_CLIENT_ID}" ]]; then
            echo "Missing required secret: AZURE_CLIENT_ID"
            MISSING=1
          fi
          if [[ -z "${AZURE_TENANT_ID}" ]]; then
            echo "Missing required secret: AZURE_TENANT_ID"
            MISSING=1
          fi
          if [[ -z "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "Missing required secret: AZURE_SUBSCRIPTION_ID"
            MISSING=1
          fi
          if [[ -z "${AZURE_REGISTRY_URL}" ]]; then
            echo "Missing required secret: AZURE_REGISTRY_URL"
            MISSING=1
          fi

          if [[ "${MISSING}" -eq 1 ]]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip build when required secrets are missing
        if: ${{ steps.prereq.outputs.should_skip == 'true' }}
        run: |
          echo "Skipping image build because required secrets are not configured."
          echo "Expected secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_REGISTRY_URL"

      - name: Resolve Azure login mode
        id: azure_login
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LEGACY_AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
          LEGACY_AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
          LEGACY_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}
        run: |
          set -euo pipefail
          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "auth_mode=new" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${LEGACY_AZURE_CLIENT_ID}" && -n "${LEGACY_AZURE_TENANT_ID}" && -n "${LEGACY_AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "auth_mode=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing Azure login secrets: provide AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID or the legacy AZUREAPPSERVICE_* trio" >&2
          exit 1

      - name: Azure login
        if: ${{ steps.azure_login.outputs.auth_mode == 'new' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (legacy service principal)
        if: ${{ steps.azure_login.outputs.auth_mode == 'legacy' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}

      - name: Setup Docker Buildx
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        shell: bash
        env:
          AZURE_REGISTRY_URL: ${{ secrets.AZURE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          REGISTRY_NAME="${AZURE_REGISTRY_URL%%.*}"
          az acr login --name "${REGISTRY_NAME}"

      - name: Resolve image metadata
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        id: meta
        shell: bash
        env:
          AZURE_REGISTRY_URL: ${{ secrets.AZURE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::12}"
          IMAGE_REPO="${AZURE_REGISTRY_URL}/wave9-backend-api"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER_TAG="${GITHUB_REF_NAME}"
          else
            SEMVER_TAG=""
          fi
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=${SEMVER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend/api Docker image
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPO="${{ steps.meta.outputs.image_repo }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          SEMVER_TAG="${{ steps.meta.outputs.semver_tag }}"

          TAG_ARGS=( -t "${IMAGE_REPO}:${SHA_TAG}" )
          if [[ -n "${SEMVER_TAG}" ]]; then
            TAG_ARGS+=( -t "${IMAGE_REPO}:${SEMVER_TAG}" )
          fi

          docker buildx build \
            --push \
            --file backend/api/Dockerfile \
            "${TAG_ARGS[@]}" \
            --iidfile image.iid \
            .

          DIGEST="$(cat image.iid | sed 's/^.*@//')"
          if [[ "${DIGEST}" != sha256:* ]]; then
            echo "Digest format not recognized: ${DIGEST}" >&2
            exit 1
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          printf "image_repo=%s\nsha_tag=%s\nsemver_tag=%s\ndigest=%s\n" \
            "${IMAGE_REPO}" "${SHA_TAG}" "${SEMVER_TAG}" "${DIGEST}" > image-digest.txt

      - name: Upload image digest artifact
        if: ${{ steps.prereq.outputs.should_skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-digest
          path: image-digest.txt
