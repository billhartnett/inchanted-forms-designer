name: Backend Build & Deploy (ACA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend contracts and API
        run: |
          pnpm --filter shared build
          pnpm --filter wave8 build
          pnpm --filter wave9 build
          pnpm --filter inchanted-api build

      - name: Resolve Azure login mode
        id: azure_login
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LEGACY_AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
          LEGACY_AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
          LEGACY_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}
        run: |
          set -euo pipefail
          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "auth_mode=new" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${LEGACY_AZURE_CLIENT_ID}" && -n "${LEGACY_AZURE_TENANT_ID}" && -n "${LEGACY_AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "auth_mode=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing Azure login secrets: provide AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID or the legacy AZUREAPPSERVICE_* trio" >&2
          exit 1

      - name: Login to Azure
        if: ${{ steps.azure_login.outputs.auth_mode == 'new' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure (legacy service principal)
        if: ${{ steps.azure_login.outputs.auth_mode == 'legacy' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_986A7A2873804FA28E16B668A4EB50D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_05C710938C214567A566D4BD60D6672C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F116AB14D00D49978DCE3FAC69ACCB4B }}

      - name: Ensure Azure Container Apps CLI extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --allow-preview true --yes

      - name: Validate backend ACA targets
        shell: bash
        env:
          AZURE_RG: ${{ secrets.AZURE_RG }}
          AZURE_BACKEND_APP: ${{ secrets.AZURE_BACKEND_APP }}
          AZURE_BACKEND_IMAGE: ${{ secrets.AZURE_BACKEND_IMAGE }}
        run: |
          set -euo pipefail
          echo "Proceeding to deploy; deploy step will enforce required inputs."

      - name: Resolve backend deploy targets
        id: backend_targets
        shell: bash
        env:
          AZURE_RG: ${{ secrets.AZURE_RG }}
          AZURE_BACKEND_APP: ${{ secrets.AZURE_BACKEND_APP }}
          AZURE_BACKEND_IMAGE: ${{ secrets.AZURE_BACKEND_IMAGE }}
        run: |
          set -euo pipefail

          RG="${AZURE_RG:-inchanted-aca-rg}"
          APP="${AZURE_BACKEND_APP:-inchanted-api-staging}"
          IMAGE="${AZURE_BACKEND_IMAGE:-}"

          if ! az containerapp show --name "${APP}" --resource-group "${RG}" --output none >/dev/null 2>&1; then
            MATCHED_RG_BY_NAME="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[?name=='${APP}'].resourceGroup | [0]" -o tsv || true)"
            if [[ -n "${MATCHED_RG_BY_NAME}" ]]; then
              RG="${MATCHED_RG_BY_NAME}"
            fi
          fi

          if ! az containerapp show --name "${APP}" --resource-group "${RG}" --output none >/dev/null 2>&1; then
            DISCOVERED_APP="$(az resource list --resource-group "${RG}" --resource-type "Microsoft.App/containerApps" --query "[?(contains(name, 'api') || contains(name, 'back')) && !(contains(name, 'front') || contains(name, 'web') || contains(name, 'ui') || contains(name, 'designer'))].name | [0]" -o tsv || true)"
            DISCOVERED_RG="${RG}"

            if [[ -z "${DISCOVERED_APP}" ]]; then
              DISCOVERED_APP="$(az resource list --resource-group "${RG}" --resource-type "Microsoft.App/containerApps" --query "[?!(contains(name, 'front') || contains(name, 'web') || contains(name, 'ui') || contains(name, 'designer'))].name | [0]" -o tsv || true)"
            fi

            if [[ -z "${DISCOVERED_APP}" ]]; then
              DISCOVERED_APP="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[?(contains(name, 'api') || contains(name, 'back')) && !(contains(name, 'front') || contains(name, 'web') || contains(name, 'ui') || contains(name, 'designer'))].name | [0]" -o tsv || true)"
              if [[ -n "${DISCOVERED_APP}" ]]; then
                DISCOVERED_RG="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[?name=='${DISCOVERED_APP}'].resourceGroup | [0]" -o tsv || true)"
              fi
            fi

            if [[ -z "${DISCOVERED_APP}" ]]; then
              DISCOVERED_APP="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[?!(contains(name, 'front') || contains(name, 'web') || contains(name, 'ui') || contains(name, 'designer'))].name | [0]" -o tsv || true)"
              if [[ -n "${DISCOVERED_APP}" ]]; then
                DISCOVERED_RG="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[?name=='${DISCOVERED_APP}'].resourceGroup | [0]" -o tsv || true)"
              fi
            fi

            if [[ -z "${DISCOVERED_APP}" ]]; then
              TOTAL_APPS="$(az resource list --resource-type "Microsoft.App/containerApps" --query "length(@)" -o tsv || echo 0)"
              if [[ "${TOTAL_APPS}" == "1" ]]; then
                DISCOVERED_APP="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[0].name" -o tsv || true)"
                DISCOVERED_RG="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[0].resourceGroup" -o tsv || true)"
              fi
            fi

            if [[ -n "${DISCOVERED_APP}" && -n "${DISCOVERED_RG}" ]]; then
              APP="${DISCOVERED_APP}"
              RG="${DISCOVERED_RG}"
            else
              AVAILABLE_APPS_IN_RG="$(az resource list --resource-group "${RG}" --resource-type "Microsoft.App/containerApps" --query "[].name" -o tsv | paste -sd ',' - || true)"
              AVAILABLE_APPS_ALL="$(az resource list --resource-type "Microsoft.App/containerApps" --query "[].name" -o tsv | paste -sd ',' - || true)"
              echo "::error::Unable to find backend container app '${APP}' in resource group '${RG}', and auto-discovery found no fallback backend app. Available apps in '${RG}': ${AVAILABLE_APPS_IN_RG:-none}. Available apps in subscription: ${AVAILABLE_APPS_ALL:-none}."
              exit 1
            fi
          fi

          if [[ -z "${IMAGE}" ]]; then
            IMAGE="$(az containerapp show --name "${APP}" --resource-group "${RG}" --query properties.template.containers[0].image -o tsv)"
          fi

          if [[ -z "${IMAGE}" ]]; then
            echo "::error::Unable to resolve backend image. Set AZURE_BACKEND_IMAGE or ensure the app has an existing image."
            exit 1
          fi

          echo "resource_group=${RG}" >> "$GITHUB_OUTPUT"
          echo "container_app=${APP}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to ACA
        if: ${{ steps.backend_targets.outcome == 'success' }}
        shell: bash
        env:
          AZURE_RG: ${{ steps.backend_targets.outputs.resource_group }}
          AZURE_BACKEND_APP: ${{ steps.backend_targets.outputs.container_app }}
          AZURE_BACKEND_IMAGE: ${{ steps.backend_targets.outputs.image }}
        run: |
          set -euo pipefail
          for name in AZURE_RG AZURE_BACKEND_APP AZURE_BACKEND_IMAGE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret for deploy: ${name}" >&2
              exit 1
            fi
          done

          az containerapp update \
            --resource-group "${AZURE_RG}" \
            --name "${AZURE_BACKEND_APP}" \
            --image "${AZURE_BACKEND_IMAGE}" \
            --output none

      - name: Verify backend contract endpoints
        if: ${{ steps.backend_targets.outcome == 'success' }}
        shell: bash
        env:
          AZURE_RG: ${{ steps.backend_targets.outputs.resource_group }}
          AZURE_BACKEND_APP: ${{ steps.backend_targets.outputs.container_app }}
        run: |
          set -euo pipefail
          BACKEND_FQDN="$(az containerapp show --name "${AZURE_BACKEND_APP}" --resource-group "${AZURE_RG}" --query properties.configuration.ingress.fqdn -o tsv)"
          BASE_URL="https://${BACKEND_FQDN}"

          curl -fsS "${BASE_URL}/api/ping" >/dev/null
          curl -fsS "${BASE_URL}/api/version" >/dev/null
          curl -fsS "${BASE_URL}/api/wave9/contracts" >/dev/null
