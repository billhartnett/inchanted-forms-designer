name: Backend Build & Deploy (ACA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend contracts and API
        run: |
          pnpm --filter shared build
          pnpm --filter wave8 build
          pnpm --filter wave9 build
          pnpm --filter inchanted-api build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STAGING }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_STAGING }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_STAGING }}


      - name: Validate backend ACA targets
        shell: bash
        env:
          AZURE_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
          AZURE_BACKEND_APP: ${{ secrets.BACKEND_ACA_APP_NAME }}
          AZURE_REGISTRY_URL: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE_NAME }}

        run: |
          set -euo pipefail
          for name in AZURE_RG AZURE_BACKEND_APP AZURE_REGISTRY_URL AZURE_BACKEND_IMAGE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

          if [[ "${AZURE_BACKEND_IMAGE}" != "${AZURE_REGISTRY_URL}/"* ]]; then
            echo "Backend image must come from the configured registry: ${AZURE_BACKEND_IMAGE}" >&2
            exit 1
          fi

          REGISTRY_NAME="${AZURE_REGISTRY_URL%%.*}"
          az containerapp show --name "${AZURE_BACKEND_APP}" --resource-group "${AZURE_RG}" --output none
          az acr show --name "${REGISTRY_NAME}" --output none

      - name: Deploy backend to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RG }}
          containerAppName: ${{ secrets.AZURE_BACKEND_APP }}
          imageToDeploy: ${{ secrets.AZURE_BACKEND_IMAGE }}
          registryUrl: ${{ secrets.AZURE_REGISTRY_URL }}
          registryUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Verify backend contract endpoints
        shell: bash
        env:
          AZURE_RG: ${{ secrets.AZURE_RG }}
          AZURE_BACKEND_APP: ${{ secrets.AZURE_BACKEND_APP }}
        run: |
          set -euo pipefail
          BACKEND_FQDN="$(az containerapp show --name "${AZURE_BACKEND_APP}" --resource-group "${AZURE_RG}" --query properties.configuration.ingress.fqdn -o tsv)"
          BASE_URL="https://${BACKEND_FQDN}"

          curl -fsS "${BASE_URL}/api/ping" >/dev/null
          curl -fsS "${BASE_URL}/api/version" >/dev/null
          curl -fsS "${BASE_URL}/api/wave9/contracts" >/dev/null
