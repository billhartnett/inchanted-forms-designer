name: Promote Backend ACA

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (defaults to AZURE_BACKEND_IMAGE)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve promotion image
        id: image
        shell: bash
        env:
          AZURE_BACKEND_IMAGE: ${{ secrets.AZURE_BACKEND_IMAGE }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_IMAGE_TAG}" ]]; then
            if [[ "${AZURE_BACKEND_IMAGE}" == *"@sha256:"* ]]; then
              IMAGE_REPO="${AZURE_BACKEND_IMAGE%%@*}"
            else
              IMAGE_REPO="${AZURE_BACKEND_IMAGE%%:*}"
            fi
            PROMOTE_IMAGE="${IMAGE_REPO}:${INPUT_IMAGE_TAG}"
          else
            PROMOTE_IMAGE="${AZURE_BACKEND_IMAGE}"
          fi
          echo "image=${PROMOTE_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Validate production ACA targets
        shell: bash
        env:
          AZURE_RG: ${{ secrets.AZURE_RG }}
          AZURE_BACKEND_APP: ${{ secrets.AZURE_BACKEND_APP }}
          AZURE_REGISTRY_URL: ${{ secrets.AZURE_REGISTRY_URL }}
          PROMOTE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for name in AZURE_RG AZURE_BACKEND_APP AZURE_REGISTRY_URL PROMOTE_IMAGE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required value: ${name}" >&2
              exit 1
            fi
          done

          if [[ "${PROMOTE_IMAGE}" != "${AZURE_REGISTRY_URL}/"* ]]; then
            echo "Promotion image must come from the configured registry: ${PROMOTE_IMAGE}" >&2
            exit 1
          fi

          REGISTRY_NAME="${AZURE_REGISTRY_URL%%.*}"
          az containerapp show --name "${AZURE_BACKEND_APP}" --resource-group "${AZURE_RG}" --output none
          az acr show --name "${REGISTRY_NAME}" --output none

      - name: Promote backend image to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RG }}
          containerAppName: ${{ secrets.AZURE_BACKEND_APP }}
          imageToDeploy: ${{ steps.image.outputs.image }}
          registryUrl: ${{ secrets.AZURE_REGISTRY_URL }}
          registryUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Verify production backend endpoints
        shell: bash
        env:
          AZURE_RG: ${{ secrets.AZURE_RG }}
          AZURE_BACKEND_APP: ${{ secrets.AZURE_BACKEND_APP }}
        run: |
          set -euo pipefail
          BACKEND_FQDN="$(az containerapp show --name "${AZURE_BACKEND_APP}" --resource-group "${AZURE_RG}" --query properties.configuration.ingress.fqdn -o tsv)"
          BASE_URL="https://${BACKEND_FQDN}"

          curl -fsS "${BASE_URL}/api/ping" >/dev/null
          curl -fsS "${BASE_URL}/api/version" >/dev/null
          curl -fsS "${BASE_URL}/api/wave9/contracts" >/dev/null
